---
# https://copy.fail/#mitigation
- name: Mitigate CVE-2026-31431 and upgrade system
  hosts: "{{ playbook_hosts | default('localhost') }}"
  gather_facts: true
  become: true

  tasks:
    - name: Disable algif_aead via modprobe config
      ansible.builtin.copy:
        dest: /etc/modprobe.d/disable-algif_aead.conf
        content: "install algif_aead /bin/false\n"
        owner: root
        group: root
        mode: "0644"

    - name: Ensure algif_aead module is absent (unloaded)
      community.general.modprobe:
        name: algif_aead
        state: absent

    - name: Upgrade all packages with apt-daily mitigation
      block:
        - name: Prepare apt-daily mitigation
          ansible.builtin.import_role:
            name: apt_daily_mitigation
            tasks_from: prepare

        - name: Upgrade all packages
          ansible.builtin.apt:
            autoremove: true
            update_cache: true
            upgrade: dist

      always:
        - name: Restore apt-daily timers after upgrade attempt
          ansible.builtin.import_role:
            name: apt_daily_mitigation
            tasks_from: restore

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required

    - name: Notify reboot requirement
      ansible.builtin.debug:
        msg: "Reboot is required to complete the upgrade."
      when: reboot_required.stat.exists
